    <style>

        }

        }

        .color-preset-btn {

            padding: 0;
            transition: transform 0.2s ease filter .5s ease;
        }
        .color-preset-btn:hover {
            transform: scale(1.1);
        }
        .color-preset-btn.active {
            filter: brightness(1.15);
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.75);
            backdrop-filter: blur(2.5px);

            align-items: center;

        }

        .modal-overlay.active {
            opacity: 1;

        }

        .modal-content {
            background-color: rgba(255,255,255,.75);

            margin-bottom: 10px;
        }

        }

        .share-url-container {

        }
        #live-view {

        }
        .live-main {
            flex: 1;

            flex-direction: column;

        #live-view .segment-title { font-size: clamp(15px, 4vw, 100px); margin-bottom: .5dvh; }
        #live-view .live-clock { font-size: clamp(50px, 15vw, 300px); margin-bottom: .5dvh; }
        #live-view .countdown { font-size: clamp(25px, 5vw, 100px); }
        .live-connecting-badge {
            position: fixed;
            top: 20px;
            left: 50%;

            font-weight: 600;

            text-transform: uppercase;
            color: inherit;
            opacity: 0.7;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid currentColor;
            background-color: rgba(128,128,128,0.15);
            z-index: 10;
        }
        .live-connecting-badge .pulse-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-top: -2px;
            margin-right: 8px;
            border-radius: 50%;
            background-color: #ff9e00;
            vertical-align: middle;
            animation: pulseDot 1.4s ease-in-out infinite;
        }
        @keyframes pulseDot {
            0% { box-shadow: 0 0 0 0 rgba(255, 158, 0, 1); }
            70% { box-shadow: 0 0 0 6px rgba(255, 158, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 158, 0, 0); }
        }
        .live-message-banner {
            background-color: var(--accent-red);
            color: white;
            font-size: clamp(20px, 3vw, 30px);
            font-weight: 400;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, background-color 0.3s ease, color 0.3s ease;
            background-image: linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,0));
        }
        .live-message-banner.msg-visible {
            max-height: 10dvh; 
            opacity: 1;
        }
        .marquee-content {
            display: inline-block;
            padding: 1.5dvh 0; 
        }
        .static-measure {
            display: inline-block;
            padding-left: 0;
            white-space: nowrap;
        }
        .marquee-static {
            display: block;
            text-align: center;
            padding-left: 0;
        }
        .marquee-active {
            padding-left: 100%;
            animation: marquee 20s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }
        .live-footer {
            background-image: linear-gradient(#fff, rgba(255, 255, 255, .75)); 
            color: var(--text-dark);
            padding: 2dvh 4vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .live-footer .next-label {
            font-size: clamp(10px, 1vw, 15px);
            font-weight: 700;
            color: rgba(0,0,0,.35);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .live-footer .next-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: clamp(20px, 2.5vw, 30px);
            font-weight: 600;
            line-height: 1.1;
        }
        b, strong { font-weight: 700; }
        i, em { font-style: italic; }
        .live-clock, .countdown { font-variant-numeric: tabular-nums; }
        .digit { display: inline-block; min-width: 0.65em; text-align: center; }
        .live-clock .digit:nth-child(3), .live-clock .digit:nth-child(6) { margin: 0 -2.5vw; }
        .countdown .digit:nth-child(3), .countdown .digit:nth-child(6) { margin: 0 -.5vw; }
        .digit-fade { animation: digitFadeIn 0.3s ease-out; }
        @keyframes digitFadeIn {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .swipe-up { animation: swipeUpAnim 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes swipeUpAnim {
            0% { transform: translateY(30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .readonly-input {
            background-color: transparent;
            border-color: transparent;
            color: inherit;
            opacity: 0.7;
            cursor: default;
        }
        .readonly-input:focus { outline: none; }
        @media (max-width: 768px) {
            .prog-display-area { padding: 15px 20px; flex: 0 0 auto; min-height: 45dvh; }
            .prog-control-area { padding: 25px 20px; flex-direction: column; gap: 25px; }
            .prog-header { margin-bottom: 20px; }
            .prog-display-controls { margin-top: 20px; gap: 10px; }
            .table-input.time-input { min-width: 75px; font-size: 12px; }
            .table-input.title-input { min-width: 90px; font-size: 12px; }
            .file-actions { flex-wrap: wrap; }
            .bottom-actions { flex-wrap: wrap; gap: 10px; }
            #message-input { min-height: 50px; font-size: 12px; }
            .table-responsive { mask: linear-gradient(90deg, black 90%, transparent) }
        }
    </style>

<body>
    <div id="program-view" class="view-container">
        <div id="prog-display-area" class="prog-display-area">
            <div class="prog-header">
                <div class="logo">Run<strong>Down</strong><span class="version">v2026.08.24.1424</span></div>
                <div class="credit">Codecrafted by <a href="https://stefanus.hosea.id" target="_blank"><strong>Stefanus Hosea</strong></a></div>
            </div>
            <div class="prog-main-clock">
                <div id="prog-title" class="segment-title"></div>
                <div id="prog-clock" class="live-clock">00:00:00</div>
                <div id="prog-countdown" class="countdown"></div>
            </div>
            <div class="prog-display-controls">
                <div style="display:flex; gap: 10px;">
                    <button id="btn-swap-clock" class="pill-btn outline" title="Swap the clock and countdown display">SWAP</button>
                    <button id="btn-quick-next" class="pill-btn">QUICK NEXT</button>
                </div>
                <div style="display:flex; gap: 10px;">
                    <button id="btn-share-link" class="pill-btn outline">SHARE LINK</button>
                    <button id="btn-present" class="pill-btn">PRESENT</button>
                </div>
            </div>
        </div>
        <div class="prog-control-area">
            <div class="table-section">
                <div class="table-responsive">
                    <table id="segment-table">
                        <thead>
                            <tr>
                                <th style="width: 15%;">START</th>
                                <th style="width: 15%;">END</th>
                                <th style="width: 45%;">TITLE</th>
                                <th style="width: 15%;">DURATION</th>
                                <th style="width: 5%;">COLOR</th>
                                <th style="width: 5%;"></th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                        </tbody>
                    </table>
                </div>
                <div id="editor-container" class="hidden">
                    <div class="section-label">EDITOR MODE</div>
                    <textarea id="raw-editor" spellcheck="false" placeholder="Start | End | Segment | Duration | Color Hex&#10;12:00:00 | 13:00:00 | Opening Segment | 01:00:00 | #000000"></textarea>
                </div>
                <div class="bottom-actions">
                    <div class="file-actions">
                        <button id="btn-load" class="pill-btn outline">LOAD</button>
                        <button id="btn-export" class="pill-btn outline">EXPORT</button>
                        <input type="file" id="file-input" accept=".run" class="hidden">
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button id="btn-editor-mode" class="pill-btn outline small">RAW EDITOR</button>
                        <button id="btn-add-row" class="pill-btn outline small">+ ADD</button>
                    </div>
                </div>
            </div>
            <div class="message-section">
                <div class="section-label">MESSAGE</div>
                <textarea id="message-input" placeholder="Display a message with **markdown** _formatting_"></textarea>
                <div class="msg-btn-container">
                    <div class="msg-color-presets" id="msg-color-presets">
                        <button class="color-preset-btn" data-bg="#b10000" data-color="#ffffff" style="background-color: #b10000;" title="Red"></button>
                        <button class="color-preset-btn" data-bg="#fdee00" data-color="#000000" style="background-color: #fdee00;" title="Yellow"></button>
                        <button class="color-preset-btn" data-bg="#ffffff" data-color="#000000" style="background-color: #ffffff;" title="White"></button>
                        <button class="color-preset-btn" data-bg="#000000" data-color="#ffffff" style="background-color: #000000;" title="Black"></button>
                    </div>
                    <button id="btn-show-msg" class="pill-btn filled">SHOW</button>
                </div>
            </div>
        </div>
    </div>
    <div id="live-view" class="view-container hidden">
        <div id="live-connecting" class="live-connecting-badge hidden"><span class="pulse-dot"></span>Connecting…</div>
        <div class="live-main">
            <div id="live-title" class="segment-title"></div>
            <div id="live-clock" class="live-clock">00:00:00</div>
            <div id="live-countdown" class="countdown"></div>
        </div>
        <div id="live-msg-container" class="live-message-banner">
            <div id="live-marquee" class="marquee-content"></div>
        </div>
        <div id="live-footer" class="live-footer">
            <div class="next-info">
              <div>
                <div class="next-label">UPCOMING NEXT</div>
                <span id="live-next-title">--</span>
              </div>
              <div>
                <span id="live-next-time">--:--</span>
              </div>
            </div>

            } catch(e) {}

            } catch(e) {}

        async function initP2P(roomId) {
            if (!window.trystero) {
                console.warn("Trystero not loaded. Retrying in 100ms...");
                setTimeout(() => initP2P(roomId), 100);
                return;
            }
            console.log(`Initializing P2P Room: ${roomId}`);
            p2pRoom = trystero.joinRoom(P2P_CONFIG, roomId);
            const stateSync = p2pRoom.makeAction('stateSync');
            sendStateP2P = (data, peerId) => stateSync.send(data, peerId ? { target: peerId } : undefined);
            const cmdSync = p2pRoom.makeAction('cmdSync');
            sendCmdP2P = (data, peerId) => cmdSync.send(data, peerId ? { target: peerId } : undefined);
            if (!isLiveView) {
                p2pControlToken = await ensureControlToken(roomId);
                cmdSync.onMessage = (data, meta) => {
                    const peerId = meta && meta.peerId;
                    console.log("Host received command:", data);
                    const isAuthorized = p2pControlToken && data.token === p2pControlToken;
                    if (data.type === 'COMMAND_QUICK_NEXT') { if (isAuthorized) els.btnQuickNext.click(); }
                    else if (data.type === 'COMMAND_TOGGLE_MSG') { if (isAuthorized) els.btnShowMsg.click(); }
                    else if (data.type === 'COMMAND_TOGGLE_SWAP') { if (isAuthorized) els.btnSwapClock.click(); }
                    else if (data.type === 'REQUEST_STATE') {
                        sendStateP2P(AppState, peerId);
                    }
                };
                p2pRoom.onPeerJoin = peerId => {
                    console.log("Peer joined, proactively sending state to:", peerId);
                    p2pPeers.add(peerId);
                    updateShareStatus();
                    sendStateP2P(AppState, peerId);
                };
                p2pRoom.onPeerLeave = peerId => {
                    p2pPeers.delete(peerId);
                    updateShareStatus();
                };
            }
            else {
                let receivedState = false;
                stateSync.onMessage = data => {
                    console.log("Viewer received state update");
                    receivedState = true;
                    els.lConnecting.classList.add('hidden');
                    updateLiveUIFromState(data);

                p2pRoom.onPeerJoin = peerId => {
                     console.log("Found peer, requesting state from:", peerId);
                     sendCmdP2P({ type: 'REQUEST_STATE' }, peerId);

                    if (!receivedState && Object.keys(p2pRoom.getPeers()).length > 0) {
                         console.log("State not received yet, requesting again...");
                         sendCmdP2P({ type: 'REQUEST_STATE' });
                    } else if (receivedState) {
                        clearInterval(requestInterval);
                    }

        }
        function timeToSeconds(timeStr) {
            if (!timeStr) return 0;
            const parts = timeStr.split(':').map(Number);
            return (parts[0] || 0) * 3600 + (parts[1] || 0) * 60 + (parts[2] || 0);
        }
        function secondsToTime(totalSeconds) {
            const isNeg = totalSeconds < 0;
            let s = Math.abs(totalSeconds);
            s = s % 86400; 
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = Math.floor(s % 60);
            const formatted = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
            return isNeg ? `-${formatted}` : formatted;

        function getCurrentSeconds() {
            const now = new Date();
            return now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
        }
        function parseMarkdown(text) {
            if (!text) return '';
            return text
                .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                .replace(/\*(.*?)\*/g, '<i>$1</i>')
                .replace(/_(.*?)_/g, '<i>$1</i>');
        }
        function getContrastYIQ(hexcolor) {
            if (!hexcolor) return '#ffffff';
            hexcolor = hexcolor.replace("#", "");
            if (hexcolor.length === 3) {
                 hexcolor = hexcolor.split('').map(x => x + x).join('');
            }
            var r = parseInt(hexcolor.substr(0,2),16);
            var g = parseInt(hexcolor.substr(2,2),16);
            var b = parseInt(hexcolor.substr(4,2),16);

            const clockSlotText = swapActive ? countdownStr : nowTimeStr;
            const countdownSlotText = swapActive ? nowTimeStr : countdownStr;
            if (isLiveView) updateFadingDigits(els.lClock, clockSlotText);
            else updateFadingDigits(els.pClock, clockSlotText);
            if (currentSegment?.id !== lastActiveSegmentId) {
                lastActiveSegmentId = currentSegment?.id;
                const liveCountdownSlot = swapActive ? els.lClock : els.lCountdown;
                const progCountdownSlot = swapActive ? els.pClock : els.pCountdown;
                [els.lTitle, els.pTitle, liveCountdownSlot, progCountdownSlot].forEach(el => {
                    el.classList.remove('swipe-up');
                    void el.offsetWidth; 
                    el.classList.add('swipe-up');
                });
            }
            const defaultBg = '#0a0a0a';
            const activeColor = currentSegment && currentSegment.color ? currentSegment.color : defaultBg;
            const contrastColor = getContrastYIQ(activeColor);
            if (isLiveView) {
                els.liveView.style.backgroundColor = activeColor;
                els.liveView.style.color = contrastColor;
            } else {
                els.progView.style.backgroundColor = activeColor;
                els.progView.style.color = contrastColor;
            }
            if (isLiveView) {
                if (currentSegment) {
                    els.lTitle.textContent = currentSegment.title;
                    els.lTitle.classList.remove('invisible');
                    updateFadingDigits(els.lCountdown, countdownSlotText);
                    els.lCountdown.classList.remove('invisible');
                } else {
                    els.lTitle.classList.add('invisible');
                    els.lCountdown.classList.add('invisible');
                }
                if (nextSegment) {
                    els.lNextTitle.textContent = nextSegment.title;
                    els.lNextTime.textContent = nextSegment.start.substring(0, 5); 
                    els.lFooter.classList.remove('hidden');
                } else {
                    els.lFooter.classList.add('hidden');
                }
            } else {
                if (currentSegment) {
                    els.pTitle.textContent = currentSegment.title;
                    els.pTitle.classList.remove('invisible');
                    updateFadingDigits(els.pCountdown, countdownSlotText);
                    els.pCountdown.classList.remove('invisible');
                } else {
                    els.pTitle.classList.add('invisible');
                    els.pCountdown.classList.add('invisible');
                }
                if (nextSegment) {
                    els.btnQuickNext.classList.remove('invisible');
                } else {
                    els.btnQuickNext.classList.add('invisible');
                }
                if (currentSegment) {
                    els.btnSwapClock.classList.remove('invisible');
                } else {
                    els.btnSwapClock.classList.add('invisible');
                }
            }
            requestAnimationFrame(updateClockLoop);
        }
        function renderTable() {
            els.tbody.innerHTML = '';
            AppState.segments.forEach((seg, index) => {
                const tr = document.createElement('tr');
                tr.draggable = true;
                tr.dataset.index = index;
                const isReadonly = index > 0 ? 'readonly tabindex="-1"' : '';
                const roClass = index > 0 ? 'readonly-input' : '';
                tr.innerHTML = `
                    <td><input type="time" step="1" lang="en-GB" class="table-input time-input start-input ${roClass}" value="${seg.start}" ${isReadonly} title="${index > 0 ? 'Auto-calculated sequence' : ''}"></td>
                    <td><input type="time" step="1" lang="en-GB" class="table-input time-input end-input" value="${seg.end}"></td>
                    <td><input type="text" class="table-input title-input" value="${seg.title}"></td>
                    <td><input type="time" step="1" lang="en-GB" class="table-input time-input duration-input" value="${seg.duration}"></td>
                    <td><input type="color" class="table-input color-input" value="${seg.color || '#0a0a0a'}"></td>
                    <td>
                        <div class="row-controls">
                            <button class="drag-handle" title="Drag to reorder">≡</button>
                            <button class="delete-btn" title="Delete row">✕</button>
                        </div>
                    </td>
                `;
                els.tbody.appendChild(tr);
            });
            if (AppState.segments.length === 0) {
                els.btnExport.classList.add('hidden');
            } else {
                els.btnExport.classList.remove('hidden');
            }
            attachTableListeners();
        }
        function broadcastState() {
            saveStateToStorage();
            syncChannel.postMessage({
                type: 'STATE_UPDATE',
                payload: AppState
            });
            broadcastP2PState();
        }
        function handleDataChange(index, field, value) {
            const seg = AppState.segments[index];
            seg[field] = value;
            if (field === 'start') {
                seg.end = secondsToTime(timeToSeconds(seg.start) + timeToSeconds(seg.duration));
                cascadeTimes(index + 1);
            } else if (field === 'duration') {
                seg.end = secondsToTime(timeToSeconds(seg.start) + timeToSeconds(seg.duration));
                cascadeTimes(index + 1);
            } else if (field === 'end') {
                let endSecs = timeToSeconds(seg.end);
                let startSecs = timeToSeconds(seg.start);
                if (endSecs < startSecs) endSecs += 86400; 
                seg.duration = secondsToTime(endSecs - startSecs);
                cascadeTimes(index + 1);
            }
            if (field !== 'color') {
                renderTable();
            }
            broadcastState();
        }
        function attachTableListeners() {
            els.tbody.querySelectorAll('tr').forEach((tr, index) => {
                const startIn = tr.querySelector('.start-input');
                const endIn = tr.querySelector('.end-input');
                const titleIn = tr.querySelector('.title-input');
                const durIn = tr.querySelector('.duration-input');
                const colorIn = tr.querySelector('.color-input');
                startIn.addEventListener('change', (e) => handleDataChange(index, 'start', e.target.value));
                endIn.addEventListener('change', (e) => handleDataChange(index, 'end', e.target.value));
                titleIn.addEventListener('change', (e) => handleDataChange(index, 'title', e.target.value));
                durIn.addEventListener('change', (e) => handleDataChange(index, 'duration', e.target.value));
                colorIn.addEventListener('input', (e) => handleDataChange(index, 'color', e.target.value));
                tr.querySelector('.delete-btn').addEventListener('click', () => {
                    AppState.segments.splice(index, 1);
                    renderTable();
                    broadcastState();
                });
            });
            let draggedRow = null;
            els.tbody.addEventListener('dragstart', (e) => {
                if(e.target.tagName === 'TR') {
                    draggedRow = e.target;
                    e.target.classList.add('dragging');
                }
            });
            els.tbody.addEventListener('dragend', (e) => {
                if(e.target.tagName === 'TR') {
                    e.target.classList.remove('dragging');
                    const newSegments = [];
                    els.tbody.querySelectorAll('tr').forEach(tr => {
                        const oldIdx = tr.dataset.index;
                        newSegments.push(AppState.segments[oldIdx]);
                    });
                    AppState.segments = newSegments;
                    cascadeTimes(1); 
                    renderTable();
                    broadcastState();
                }
            });
            els.tbody.addEventListener('dragover', (e) => {
                e.preventDefault();
                const targetRow = e.target.closest('tr');
                if (targetRow && targetRow !== draggedRow) {
                    const rect = targetRow.getBoundingClientRect();
                    const next = (e.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
                    els.tbody.insertBefore(draggedRow, next ? targetRow.nextSibling : targetRow);
                }
            });
        }
        function setupProgramControls() {
            els.btnAddRow.addEventListener('click', () => {
                let lastEnd = "12:00:00";
                if (AppState.segments.length > 0) {
                    lastEnd = AppState.segments[AppState.segments.length - 1].end;
                }
                const newDur = "01:00:00";
                AppState.segments.push({
                    id: Date.now().toString(),
                    start: lastEnd,
                    end: secondsToTime(timeToSeconds(lastEnd) + timeToSeconds(newDur)),
                    title: 'Segment #1',
                    duration: newDur,
                    color: '#000000'
                });
                renderTable();
                broadcastState();
            });
            els.btnQuickNext.addEventListener('click', () => {
                const nowSecs = getCurrentSeconds();
                let currentIndex = AppState.segments.findIndex(s => {
                    const sSec = timeToSeconds(s.start);
                    let eSec = timeToSeconds(s.end);
                    if (eSec <= sSec) eSec += 86400;
                    let nSec = nowSecs;
                    if (eSec > 86400 && nSec < (eSec - 86400)) nSec += 86400;
                    return sSec <= nSec && eSec > nSec;
                });
                if (currentIndex !== -1 && currentIndex < AppState.segments.length - 1) {
                    AppState.segments[currentIndex].end = secondsToTime(nowSecs);
                    let sSec = timeToSeconds(AppState.segments[currentIndex].start);
                    let nSec = nowSecs;
                    if (nSec < sSec) nSec += 86400; 
                    AppState.segments[currentIndex].duration = secondsToTime(nSec - sSec);
                    cascadeTimes(currentIndex + 1);
                    renderTable();
                    broadcastState();
                } else if (currentIndex === -1 && AppState.segments.length > 0) {
                    const firstStart = timeToSeconds(AppState.segments[0].start);
                    if (nowSecs < firstStart) {
                        AppState.segments[0].start = secondsToTime(nowSecs);
                        AppState.segments[0].end = secondsToTime(nowSecs + timeToSeconds(AppState.segments[0].duration));
                        cascadeTimes(1);
                        renderTable();
                        broadcastState();
                    }
                }
            });
            els.btnShowMsg.addEventListener('click', () => {
                AppState.showMessage = !AppState.showMessage;
                AppState.message = els.msgInput.value;
                if (AppState.showMessage) {
                    els.btnShowMsg.textContent = "HIDE";
                    els.btnShowMsg.classList.add('active');
                } else {
                    els.btnShowMsg.textContent = "SHOW";
                    els.btnShowMsg.classList.remove('active');
                }
                broadcastState();
            });
            els.colorPresets.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    els.colorPresets.forEach(b => b.classList.remove('active'));
                    const target = e.currentTarget;
                    target.classList.add('active');
                    AppState.messageBg = target.dataset.bg;
                    AppState.messageColor = target.dataset.color;
                    if (!isLiveView) {
                        els.msgInput.style.backgroundColor = AppState.messageBg;
                        els.msgInput.style.color = AppState.messageColor;
                    }
                    if (AppState.showMessage) broadcastState();
                });
            });
            els.msgInput.addEventListener('input', () => {
                AppState.message = els.msgInput.value;
                if (AppState.showMessage) broadcastState();
            });
            let isEditorMode = false;
            els.btnEditorMode.addEventListener('click', () => {
                isEditorMode = !isEditorMode;
                const headerLine = "Start | End | Segment | Duration | Color Hex";
                if (isEditorMode) {
                    const lines = [headerLine, ...AppState.segments.map(s => `${s.start} | ${s.end} | ${s.title} | ${s.duration} | ${s.color || '#0a0a0a'}`)];
                    els.rawEditor.value = lines.join('\n');
                    els.tableResponsive.classList.add('hidden');
                    els.editorContainer.classList.remove('hidden');
                    els.btnEditorMode.textContent = "SAVE & CLOSE";
                    els.btnEditorMode.classList.add('filled', 'active');
                    els.btnEditorMode.classList.remove('outline');
                    els.btnAddRow.classList.add('hidden');
                } else {
                    const text = els.rawEditor.value;
                    const lines = text.split('\n').filter(l => l.trim().length > 0);
                    const newSegments = [];
                    lines.forEach(line => {
                        if (line.toLowerCase().includes('start |') && line.toLowerCase().includes('end |')) return; 
                        const parts = line.split('|').map(p => p.trim());
                        if (parts.length >= 4) {
                            newSegments.push({ 
                                id: Date.now()+Math.random(), 
                                start: parts[0], 
                                end: parts[1], 
                                title: parts[2], 
                                duration: parts[3],
                                color: parts[4] || '#0a0a0a'
                            });
                        }
                    });
                    AppState.segments = newSegments;
                    cascadeTimes(1);
                    renderTable();
                    broadcastState();
                    els.tableResponsive.classList.remove('hidden');
                    els.editorContainer.classList.add('hidden');
                    els.btnEditorMode.textContent = "RAW EDITOR";
                    els.btnEditorMode.classList.remove('filled', 'active');
                    els.btnEditorMode.classList.add('outline');
                    els.btnAddRow.classList.remove('hidden');
                }
            });
            els.btnExport.addEventListener('click', () => {
                const headerLine = "Start | End | Segment | Duration | Color Hex";
                const lines = [headerLine, ...AppState.segments.map(s => `${s.start} | ${s.end} | ${s.title} | ${s.duration} | ${s.color || '#0a0a0a'}`)];
                const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `rundown_${new Date().toISOString().slice(0,10)}.run`;
                a.click();
                URL.revokeObjectURL(url);
            });
            els.btnLoad.addEventListener('click', () => els.fileInput.click());
            els.fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const text = ev.target.result;
                    const lines = text.split('\n').filter(l => l.trim().length > 0);
                    const newSegments = [];
                    lines.forEach(line => {
                        if (line.toLowerCase().includes('start |') && line.toLowerCase().includes('end |')) return; 
                        const parts = line.split('|').map(p => p.trim());
                        if (parts.length >= 4) {
                            newSegments.push({ 
                                id: Date.now()+Math.random(), 
                                start: parts[0], 
                                end: parts[1], 
                                title: parts[2], 
                                duration: parts[3],
                                color: parts[4] || '#0a0a0a' 
                            });
                        }
                    });
                    if(newSegments.length > 0) {
                        AppState.segments = newSegments;
                        cascadeTimes(1); 
                        renderTable();
                        broadcastState();
                    }
                };
                reader.readAsText(file);
                els.fileInput.value = ''; 
            });
            function renderShareQr(url) {
                try {
                    const qr = qrcode(0, 'M'); 
                    qr.addData(url);
                    qr.make();
                    els.shareQr.innerHTML = qr.createSvgTag(4, 12);
                } catch (e) {
                    console.warn('Could not render share QR code.', e);
                    els.shareQr.innerHTML = '';
                }
            }
            els.btnSwapClock.addEventListener('click', () => {
                AppState.swapClock = !AppState.swapClock;
                els.btnSwapClock.classList.toggle('active', AppState.swapClock);
                broadcastState();
            });
            els.btnShareLink.addEventListener('click', async () => {
                let rId = p2pRoomId;
                if (!rId) {
                    rId = await generateRoomName();
                    if (window.location.protocol !== 'blob:') {
                        const newUrl = new URL(window.location.href);
                        newUrl.searchParams.set('room', rId);
                        window.history.replaceState({}, '', newUrl);
                    } else {
                    }
                    await initP2P(rId);
                }
                let shareUrl = window.location.href;
                if (window.location.protocol === 'blob:') {
                    shareUrl = `https://rundown.app/?room=${rId}&view=live`;
                } else {
                    const u = new URL(window.location.href);
                    u.searchParams.set('room', rId);
                    u.searchParams.set('view', 'live');
                    shareUrl = u.toString();
                }
                if (els.shareControlCheckbox.checked && p2pControlToken) {
                    shareUrl += (shareUrl.includes('?') ? '&' : '?') + 'ctrl=' + encodeURIComponent(p2pControlToken);
                }
                els.shareUrlInput.value = shareUrl;
                renderShareQr(shareUrl);
                els.btnCopyUrl.textContent = "COPY";
                updateShareStatus();
                els.shareModal.classList.add('active');
            });
            els.shareControlCheckbox.addEventListener('change', () => {
                const u = new URL(els.shareUrlInput.value);
                if (els.shareControlCheckbox.checked && p2pControlToken) {
                    u.searchParams.set('ctrl', p2pControlToken);
                } else {
                    u.searchParams.delete('ctrl');
                }
                els.shareUrlInput.value = u.toString();
                renderShareQr(u.toString());
            });
            els.btnCopyUrl.addEventListener('click', () => {
                els.shareUrlInput.select();
                els.shareUrlInput.setSelectionRange(0, 99999);
                navigator.clipboard.writeText(els.shareUrlInput.value);
                els.btnCopyUrl.textContent = "COPIED!";
            });
            els.shareModal.addEventListener('click', (e) => {
                if (e.target === els.shareModal) {
                    els.shareModal.classList.remove('active');
                }
            });
            els.btnPresent.addEventListener('click', () => {
                const currentUrl = new URL(window.location.href);
                currentUrl.searchParams.set('view', 'live');
                window.open(currentUrl.href, 'RunDownLiveWindow', 'width=1280,height=720,menubar=no,toolbar=no,location=no,status=no');
                setTimeout(broadcastState, 1000); 
            });
        }
        window.addEventListener('keydown', (e) => {
            if (!document.hasFocus()) return;
            const activeTag = document.activeElement ? document.activeElement.tagName : '';
            if (activeTag === 'INPUT' || activeTag === 'TEXTAREA') return;
            switch (e.key.toLowerCase()) {
                case 'q':
                    e.preventDefault();
                    if (isLiveView) {
                        syncChannel.postMessage({ type: 'COMMAND_QUICK_NEXT' });
                        if(sendCmdP2P) sendCmdP2P({ type: 'COMMAND_QUICK_NEXT', token: p2pControlToken });
                    } else {
                        els.btnQuickNext.click();
                    }
                    break;
                case 'p':
                    e.preventDefault();
                    if (!isLiveView) els.btnPresent.click();
                    break;
                case '1':
                    e.preventDefault();
                    if (isLiveView) {
                        syncChannel.postMessage({ type: 'COMMAND_TOGGLE_MSG' });
                        if(sendCmdP2P) sendCmdP2P({ type: 'COMMAND_TOGGLE_MSG', token: p2pControlToken });
                    } else {
                        els.btnShowMsg.click();
                    }
                    break;
                case 's':
                    e.preventDefault();
                    if (isLiveView) {
                        syncChannel.postMessage({ type: 'COMMAND_TOGGLE_SWAP' });
                        if(sendCmdP2P) sendCmdP2P({ type: 'COMMAND_TOGGLE_SWAP', token: p2pControlToken });
                    } else {
                        els.btnSwapClock.click();
                    }
                    break;
            }
        });
        function updateLiveUIFromState(state) {
            AppState.segments = state.segments;
            AppState.swapClock = !!state.swapClock;
            if (state.showMessage && state.message.trim() !== '') {
                els.lMsgContainer.classList.add('msg-visible');
                els.lMsgContainer.style.backgroundColor = state.messageBg || '#b10000';
                els.lMsgContainer.style.color = state.messageColor || '#ffffff';
                if (els.lMarquee.dataset.raw !== state.message) {
                    els.lMarquee.dataset.raw = state.message;
                    els.lMarquee.innerHTML = parseMarkdown(state.message);
                    els.lMarquee.className = 'marquee-content static-measure';
                    els.lMarquee.style.animation = 'none';
                    requestAnimationFrame(() => {
                        const containerWidth = els.lMsgContainer.clientWidth;
                        const textWidth = els.lMarquee.scrollWidth;
                        if (textWidth > containerWidth) {
                            els.lMarquee.className = 'marquee-content marquee-active';
                            els.lMarquee.style.animation = ''; 
                        } else {
                            els.lMarquee.className = 'marquee-content marquee-static';
                        }
                    });
                }
            } else {
                els.lMsgContainer.classList.remove('msg-visible');
            }
        }
        function initApp() {
            if (isLiveView) {
                document.title = "RunDown - LIVE";
                els.progView.classList.add('hidden');
                els.liveView.classList.remove('hidden');
                els.liveView.style.display = 'flex'; 
                syncChannel.onmessage = (event) => {
                    if (event.data.type === 'STATE_UPDATE') {
                        els.lConnecting.classList.add('hidden');
                        updateLiveUIFromState(event.data.payload);
                    }
                };
                if (p2pRoomId) {
                    els.lConnecting.classList.remove('hidden');
                    initP2P(p2pRoomId);
                } else {
                    syncChannel.postMessage({ type: 'REQUEST_STATE' });
                }
            } else {
                loadStateFromStorage();
                if (p2pRoomId && getSavedControlToken(p2pRoomId)) {
                    initP2P(p2pRoomId);
                }
                els.msgInput.value = AppState.message;
                if (AppState.showMessage) {
                    els.btnShowMsg.textContent = "HIDE";
                    els.btnShowMsg.classList.add('active');
                }
                let hasActiveColor = false;
                els.colorPresets.forEach(btn => {
                    if (btn.dataset.bg === AppState.messageBg) {
                        btn.classList.add('active');
                        hasActiveColor = true;
                    } else {
                        btn.classList.remove('active');
                    }
                });
                if (!hasActiveColor && els.colorPresets.length > 0) {
                    const whiteBtn = Array.from(els.colorPresets).find(b => b.dataset.bg === '#ffffff') || els.colorPresets[0];
                    whiteBtn.classList.add('active');
                    AppState.messageBg = whiteBtn.dataset.bg;
                    AppState.messageColor = whiteBtn.dataset.color;
                }
                els.msgInput.style.backgroundColor = AppState.messageBg;
                els.msgInput.style.color = AppState.messageColor;
                if (AppState.swapClock) {
                    els.btnSwapClock.classList.add('active');
                }
                renderTable();
                setupProgramControls();
                syncChannel.onmessage = (event) => {
                    if (event.data.type === 'REQUEST_STATE') {
                        broadcastState();
                    } else if (event.data.type === 'COMMAND_QUICK_NEXT') {
                        els.btnQuickNext.click();
                    } else if (event.data.type === 'COMMAND_TOGGLE_MSG') {
                        els.btnShowMsg.click();
                    } else if (event.data.type === 'COMMAND_TOGGLE_SWAP') {
                        els.btnSwapClock.click();
                    }
                };
                broadcastState();
            }
            requestAnimationFrame(updateClockLoop);
        }
        initApp();
    </script>
</body>
</html>
